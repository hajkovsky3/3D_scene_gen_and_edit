# Rýchly profil na vývoj a ladenie ďalších fáz. Prekrýva iba uvedené kľúče z default.yaml.
# Finálne čísla do práce počítať s default.yaml.
# Použitie: python -m scenepipe run <fáza> --scene <scéna> --profile fast (alebo v okne monitora)

# --- 01_sfm ---
sfm:
  matcher: retrieval        # susedné snímky + podobné snímky namiesto všetkých dvojíc
  max_num_features: 4096
  sift_max_image_size: 1024

# --- 02_reconstruction ---
reconstruction:
  iterations: 7000
  cap_max: 500000

# --- 03_refinement ---
refinement:
  finetune_steps: 1000      # ~2 min namiesto ~4,5 min, najhorší pohľad horší (pozri phases/03_refinement.md)

# --- 04_tagging ---
tagging:
  sample_frames: 15         # ~15 s tagovania namiesto ~30 s (načítanie modelu ~30 s ostáva)

# --- 05_segmentation ---
segmentation:
  frame_stride: 3           # každá 3. snímka: counter 18 min namiesto ~1 h (GTX 1650)
  redetect_every: 5         # okno 5 spracovaných snímok = 15 pôvodných
