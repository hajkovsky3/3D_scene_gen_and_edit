# Kde beží ktorá fáza, keď ju spúšťa okno monitora (tlačidlo Spustiť).
# Skopíruj na configs/local.yaml (je v .gitignore) a uprav pre svoj počítač.
#
# command: príkaz, ktorý spustí CLI `python -m scenepipe <args>`; zástupné hodnoty:
#   {args}   argumenty CLI (samostatný prvok = vloží sa ako zoznam, v reťazci = shell-escaped)
#   {python} Python, v ktorom beží monitor
#   {phase}, {scene}
# stop: voliteľný príkaz na zastavenie (napr. WSL: ukončenie wsl.exe nezastaví proces v Linuxe).
# Bez tohto súboru bežia všetky fázy v aktuálnom Pythone.

runners:
  local:
    command: ["{python}", "-m", "scenepipe", "{args}"]
  wsl_gs:   # GPU fázy vo WSL (prostredie sp-gs, pozri envs/README.md)
    command: ["wsl.exe", "-d", "Ubuntu", "--", "bash", "-lc",
              "source ~/sp-gs.sh && python -m scenepipe {args}"]
    stop: ["wsl.exe", "-d", "Ubuntu", "--", "pkill", "-f", "scenepipe run {phase} --scene {scene}"]

# Koľko fáz smie bežať naraz (nezávislé vetvy, napr. 04 → 05 → 06 popri 02 → 03).
# Všetky GPU fázy sa delia o jednu GPU; 1 = jedna fáza po druhej. Na GTX 1650 (4 GB) a 12 GB RAM
# pre WSL súbežný beh nepomáha: 02 + 05 zaplnia VRAM, tréning je ~2,5× pomalší a dôjde RAM.
max_parallel: 1

phases:
  default: local
  01_sfm: wsl_gs              # párovanie na GPU (PyTorch v sp-gs)
  02_reconstruction: wsl_gs
  03_refinement: wsl_gs        # metriky pred/po cez gsplat
  04_tagging: wsl_gs           # RAM++ na GPU (zatiaľ v sp-gs, pozri envs/README.md)
  05_segmentation: wsl_gs      # Grounding DINO + SAM 2 na GPU (sp-gs)
  06_mask_embedding: wsl_gs    # OpenCLIP cez transformers na GPU (sp-gs)
  07_lifting: wsl_gs           # gsplat (sp-gs)
  08_scene_graph: wsl_gs       # VLM Qwen3-VL-4B (bitsandbytes) na GPU (sp-gs)
