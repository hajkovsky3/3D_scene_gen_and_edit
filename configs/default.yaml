# Predvolená konfigurácia. Hodnoty a význam parametrov: phases/XX_*.md, sekcia Konfigurácia.
# Zmena implementácie fázy: zmeň `impl`.
# Tu sú iba primárne implementácie s permisívnou licenciou; nekomerčné alternatívy
# (docs/licenses.md, stav NEKOMERČNÉ) sa vyberajú len cez CLI alebo vlastný config.

# --- 00_ingest ---
ingest:
  impl: basic
  video_fps: 3
  sharpness_window: 5
  sharpness_percentile_reject: 30
  dedup_threshold: 0.97
  max_side: 1600
  max_frames: 300
  min_frames: 20
  blur_filter_photos: false
  blur_max_gap_s: 1.0       # rozmazané snímky z videa sa nechajú, ak by vznikla dlhšia medzera; 0 = vypnuté
  blur_gap_min_ratio: 0.3   # ...ale nie snímky pod 0,3 × medián ostrosti videa
  keyframe_motion: 0.12     # okno výberu podľa pohybu kamery (podiel dlhšej strany); 0 = podľa času
  keyframe_max_gap_s: 2.0   # pri keyframe_motion: najdlhšie okno (stojaca kamera)
  video_hw_decode: false    # GPU dekódovanie cez ffmpeg (na GTX 1650 + HEVC z telefónu sa neinicializuje)

# --- 01_sfm ---
sfm:
  impl: colmap
  features: sift            # sift | aliked
  matcher: auto             # auto | sequential | exhaustive | retrieval | vocab_tree
  matcher_backend: default  # default | lightglue (SIFT + LightGlue v PyTorch, phases/01_sfm.md)
  lightglue_weights: checkpoints/lightglue/sift_lightglue.pth
  lightglue_min_score: 0.1
  mapper: global            # global | incremental
  fallback_incremental_below: 0.8
  single_camera: true       # true pre video z jedného telefónu
  align_up: floor_ransac    # camera_up | floor_ransac | none
  use_gpu: true             # párovanie deskriptorov na GPU cez PyTorch (ak je CUDA), inak COLMAP na CPU
  max_num_features: 8192
  sift_max_image_size: -1   # dlhšia strana obrázka pre SIFT; -1 = COLMAP default (3200)
  sequential_overlap: 5     # sequential/retrieval: počet nasledujúcich snímok v okne
  retrieval_num_neighbors: 5    # retrieval: najpodobnejšie snímky mimo okna
  retrieval_num_words: 1024     # retrieval: veľkosť slovníka vizuálnych slov
  retrieval_sample: 100000      # retrieval: počet deskriptorov na k-means
  auto_exhaustive_max: 100  # auto: exhaustive do tohto počtu snímok, inak retrieval
  max_camera_dist_ratio: 5.0  # vyradiť kamery ďalej než 5 × medián vzdialenosti; 0 = vypnuté
  min_registered: 10
  keep_work: false

# --- 02_reconstruction ---
reconstruction:
  impl: gsplat
  iterations: 30000
  sh_degree: 3
  strategy: mcmc           # default | mcmc
  cap_max: 1000000         # max gaussiánov pri mcmc
  resolution_scale: 1.0    # 0.5 pre slabší HW
  test_every: 8
  antialiased: true
  export_depth: false
  lpips: true             # LPIPS v reporte, stiahne váhy siete (AlexNet ~233 MB, VGG16 ~528 MB)
  lpips_net: alex          # alex (ako gsplat) | vgg (ako článok 3DGS, na porovnanie s literatúrou)
  num_test_renders: 8      # koľko testovacích renderov uložiť na kontrolu
  seed: 0
  compile_ssim: true       # SSIM v loss cez torch.compile (rovnaká hodnota, rýchlejšie)
  resolution_schedule: [[0.25, 0.25], [0.5, 0.5]]  # coarse-to-fine: prvá 1/4 krokov na 1/4 rozlíšenia, druhá na 1/2; [] = vypnuté
  aniso_reg: 0.7           # váha regularizácie ihiel (pomer najdlhšej a strednej osi); 0 = vypnuté
  aniso_max_ratio: 10.0    # pomer osí, od ktorého sa penalizuje
  depth_reg: 0.2           # váha hĺbkového prioru (1 - korelácia s monokulárnou hĺbkou); 0 = vypnuté
  depth_model: depth-anything/Depth-Anything-V2-Small-hf  # iba Small je Apache 2.0 (Base/Large sú CC-BY-NC)
  depth_model_dir: checkpoints/huggingface   # kam sa stiahnu váhy (relatívne ku koreňu repozitára)

# --- 03_refinement ---
refinement:
  impl: prune              # prune | none (iba skopíruje gaussiány z 02)
  crop: true               # odstrániť gaussiány mimo kvádra okolo bodov SfM; vyreže aj výhľad z okna a odrazy v podlahe
  crop_quantile: 0.01      # rozsah kvádra: kvantil..1-kvantil bodov SfM pozdĺž každej osi
  crop_margin: 0.1         # rezerva na každej strane, podiel rozsahu kvádra
  min_opacity: 0.02        # odstrániť takmer priehľadné gaussiány (sigmoid(opacity) < hodnota); 0 = vypnuté
  min_views: 3             # odstrániť gaussiány, ktoré nezasahujú do záberu aspoň toľkých tréningových kamier; 0 = vypnuté
  max_scale_frac: 0        # odstrániť gaussiány s najdlhšou osou > podiel polomeru kamier (napr. 0.5); 0 = vypnuté, zasahuje aj steny
  isolated_voxel: 0.02     # hrana voxelu na hľadanie izolovaných gaussiánov, podiel polomeru kamier
  isolated_min_count: 4    # odstrániť gaussiány, ktoré majú v okolí 3×3×3 voxelov (vrátane seba) menej gaussiánov; 0 = vypnuté
  isolated_keep_extent: 0  # izolované s 3σ najdlhšej osi > toľko voxelov ponechať (veľké, riedke oblasti); 0 = vypnuté
  max_aniso: 0             # pomer najdlhšej a strednej osi (napr. 10); 0 = vypnuté, bez dotréningu robí medzery
  aniso_action: clamp      # clamp = skrátiť najdlhšiu os na limit | remove = odstrániť
  finetune_steps: 2000     # dotréning po orezaní na tréningových pohľadoch; 0 = vypnuté (bez CUDA), inak treba CUDA
  seed: 0
  eval: true               # PSNR/SSIM/LPIPS pred a po na testovacích pohľadoch z 02
  lpips: true
  lpips_net: alex          # alex | vgg
  num_test_renders: 8

# --- 04_tagging ---
tagging:
  impl: ram_plus
  sample_frames: 30
  min_frames: 2
  score_threshold: 0.6
  high_score: 0.85          # tag z jedinej snímky prejde, ak má aspoň toto skóre
  keep_stuff_classes: true
  blacklist_file: configs/tag_blacklist.txt
  stuff_file: configs/tag_stuff.txt
  synonyms_file: configs/tag_synonyms.yaml
  # ram_plus
  checkpoint: checkpoints/ram_plus/ram_plus_swin_large_14m.pth
  tokenizer_dir: checkpoints/bert-base-uncased
  device: auto              # auto | cuda | cpu
  fp16: true
  batch_size: 4
  class_thresholds: true    # kalibrované prahy RAM++ pre jednotlivé tagy (navyše k score_threshold)

# --- 05_segmentation ---
segmentation:
  impl: gdino_sam2
  gdino_model: IDEA-Research/grounding-dino-tiny
  sam2_model: facebook/sam2.1-hiera-small   # large ~900 MB (neschválené), na 4 GB VRAM na hrane
  model_dir: checkpoints/huggingface
  device: auto
  frame_stride: 1           # spracovať každú k-tu registrovanú snímku
  box_threshold: 0.30
  text_threshold: 0.25
  vocab_batch: 20
  nms_iou: 0.7              # NMS boxov naprieč labelmi
  tracking: true
  redetect_every: 10
  track_iou: 0.5            # IoU boxov pri párovaní detekcií s trackmi
  carry_windows: 2          # koľko okien za sebou track prežije bez detekcie
  min_area_frac: 0.001
  hole_area_frac: 0.0005    # vyplniť diery menšie ako tento podiel snímky
  component_area_frac: 0.0005  # zahodiť časti masky menšie ako tento podiel (najväčšia ostáva)
  max_masks_per_frame: 100
  num_previews: 8

# --- 06_mask_embedding ---
mask_embedding:
  impl: openclip
  model: laion/CLIP-ViT-H-14-laion2B-s32B-b79K   # váhy OpenCLIP cez transformers
  model_dir: checkpoints/huggingface
  device: auto
  fp16: true
  crop_strategy: multi      # bbox | masked | multi (priemer bbox a masked)
  bbox_padding: 0.15        # okraj výrezu bbox, podiel dlhšej strany na každú stranu
  masked_padding: 0.05
  mask_background: gray     # gray | blur: čím nahradiť pixely mimo masky
  min_crop_px: 32           # menšie masky sa vynechajú (index.json: skipped)
  batch_size: 64
  compute_label_scores: true
  text_template: "a photo of a {}"

# --- 07_lifting ---
lifting:
  impl: gsplat_vote
  mask_batch: 32            # kanály masiek na jeden render (+1 kanál viditeľnosti)
  render_scale: 1.0         # renderovať v tomto podiele rozlíšenia (rýchlosť, VRAM)
  min_weight: 0.05          # uchovať W_i(m) iba ak do masky padne ≥ tento podiel gaussiánu
  support_fraction: 0.5     # gaussián je „v maske“ (nosič kandidáta pri spájaní)
  border_penalty: 0.5       # kvalita masiek dotýkajúcich sa okraja snímky
  merge_overlap: 0.3
  merge_sim: 0.75
  merge_rounds: 5
  min_confidence: 0.5
  min_coverage: 0.2
  prefer_smaller_on_overlap: true
  outlier: components       # components | none
  outlier_k: 3.0            # polomer = k × kvantil vzdialeností k najbližšiemu susedovi
  outlier_quantile: 0.9
  outlier_min_share: 0.05
  min_gaussians: 200
  min_views: 3
  zero_shot_weight: 0.5     # váha zero-shot skóre z 06 v label_votes
  feature_min_sim: 0.6
  num_debug: 6

# --- 08_scene_graph ---
scene_graph:
  impl: geometric_vlm
  vlm: Qwen/Qwen2.5-VL-7B-Instruct
  vlm_quantization: 4bit      # none | 8bit | 4bit
  views_per_caption: 2
  obb_mode: gravity_aligned   # gravity_aligned | full
  obb_trim_percent: 1.5
  on_eps_rel: 0.02
  near_delta_rel: 0.05
  semantic_relations: false

# --- 09_prompt_parsing ---
prompt_parsing:
  impl: llm_local
  model: Qwen/Qwen3-8B
  backend: transformers       # transformers | vllm | llamacpp
  quantization: 4bit
  temperature: 0.0
  max_retries: 1
  include_scene_summary: true

# --- 10_grounding ---
grounding:
  impl: clip_graph
  w_clip: 1.0
  w_label: 0.5
  w_attr: 0.3
  w_image: 1.0
  ambiguity_margin: 0.05
  reference_view: auto        # auto | <frame_id>

# --- 11_asset_generation ---
asset_generation:
  impl: flux_trellis
  t2i_model: black-forest-labs/FLUX.1-schnell
  t2i_steps: 4
  t2i_offload: true            # CPU offload pri malej VRAM
  bg_removal: birefnet
  i23d_model: microsoft/TRELLIS-image-large
  seed: 0
  num_candidates: 1            # >1 → vygenerovať viac a vybrať podľa CLIP zhody s promptom

# --- 12_editing ---
editing:
  impl: router
  inpainter: lama
  hole_dilate_px: 15
  inpaint_views: auto          # auto = pohľady, kde je diera > min_hole_frac
  min_hole_frac: 0.002
  refine_iters: 1500
  refine_lr_scale: 0.5
  recolor_keep_luminance: true
  rotate_sh: true
  harmonize_asset: false
  insert_scale_heuristics: configs/category_sizes.yaml
  max_ops: 5

# --- 13_rendering ---
rendering:
  impl: gsplat_offline
  cameras: test                # train | test | all | path:<súbor> | orbit
  orbit_frames: 120
  resolution_scale: 1.0
  outputs: [rgb]               # rgb, depth, instances, overlay
  compare_with: null           # napr. v000
  fps: 30
  background: [0, 0, 0]
