[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scenepipe"
version = "0.0.1"
description = "Modular pipeline: photos -> editable 3D Gaussian Splatting scene + scene graph, edited by text/image prompts"
requires-python = ">=3.11"
dependencies = ["numpy", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
