[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scenepipe"
version = "0.0.1"
description = "Modular pipeline: photos -> editable 3D Gaussian Splatting scene + scene graph, edited by text/image prompts"
requires-python = ">=3.11"
dependencies = ["numpy", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# per-phase extras (each phase group may live in its own environment, see envs/README.md)
ingest = ["opencv-python-headless", "pillow"]
sfm = ["pycolmap>=4.2,<4.3", "pillow"]
# torch/torchvision with CUDA: install from the PyTorch index first (envs/README.md)
gs = ["torch", "torchvision", "gsplat>=1.5,<1.6", "torchmetrics", "pillow"]
# monocular depth prior of phase 02 (depth_reg > 0), Depth Anything V2 Small via transformers
depth = ["transformers>=4.45"]
monitor = ["customtkinter>=5.2,<5.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
